<style>
  :root{ --hdr:#303134; --bg:#202124; --card:#2d2e31; --line:#3c4043; --ink:#e8eaed; --ink-soft:#9aa0a6; --accent:#8ab4f8; --accent-ink:#202124; --pill:#1f1f1f; --danger:#f28b82; --fab:#174ea6; --hour:56px; color-scheme:dark; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;-webkit-text-size-adjust:100%;}
  body{font-weight:300;min-height:100vh;min-height:100dvh;overflow-x:hidden;padding-bottom:calc(110px + env(safe-area-inset-bottom));}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  /* ----- top bar (stays put while the day grid scrolls under it) ----- */
  .top{position:sticky;top:0;z-index:20;background:var(--hdr);padding:calc(8px + env(safe-area-inset-top)) 10px 0;}
  .bar1{display:flex;align-items:center;gap:8px;height:56px;}
  .pill{display:flex;align-items:center;gap:2px;background:var(--pill);border:1px solid var(--line);border-radius:999px;height:52px;padding:0 6px;}
  .pill button{background:none;border:none;height:44px;min-width:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:22px;}
  .pill button:active{background:rgba(255,255,255,0.12);}
  .title{flex:1;min-width:0;background:none;border:none;color:var(--ink);font-size:26px;font-weight:400;text-align:left;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .title small{font-size:14px;color:var(--ink-soft);margin-left:4px;}
  .todaybox{width:34px;height:34px;border:2px solid var(--ink);border-radius:8px;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;}
  .avatar{font-weight:400;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:15px;display:flex;align-items:center;justify-content:center;border:none;}
  .sync{font-size:11px;color:var(--ink-soft);text-align:center;height:14px;line-height:14px;}
  .dow{display:flex;align-items:flex-end;padding:4px 0 6px;}
  .dow .gut{width:44px;flex:none;}
  .dow .c{flex:1;text-align:center;border:none;background:none;color:var(--ink-soft);font-size:13px;font-weight:400;padding:0;}
  .dow .c b{display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:3px auto 0;border-radius:50%;font-size:22px;font-weight:300;color:var(--ink);}
  .dow .c.today{color:var(--accent);}
  .dow .c.today b{background:var(--accent);color:var(--accent-ink);font-weight:400;}
  .dow.single .c{text-align:left;padding-left:12px;}
  .dow.single .c b{margin:3px 0 0;}
  .allday{display:flex;padding:0 0 6px;min-height:30px;}
  .allday .gut{width:44px;flex:none;}
  .allday .c{flex:1;min-width:0;padding:0 1px;display:flex;flex-direction:column;gap:2px;}
  .chip{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:4px;font-size:11px;font-weight:400;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .moretxt{font-size:10px;color:var(--ink-soft);padding:0 4px;}
  /* ----- day / week time grid: the page itself scrolls, nothing inside has its own scroll bar ----- */
  .tg{position:relative;display:flex;height:calc(var(--hour)*24);}
  .tg .labels{width:44px;flex:none;position:relative;}
  .tg .labels span{position:absolute;right:6px;transform:translateY(-50%);font-size:12px;color:var(--ink-soft);}
  .tg .cols{flex:1;display:flex;position:relative;background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hour));background-size:100% var(--hour);}
  .tg .col{flex:1;position:relative;border-left:1px solid var(--line);}
  .blk{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:absolute;border-radius:6px;padding:3px 5px;font-size:12px;line-height:1.2;overflow:hidden;cursor:pointer;border:1px solid var(--bg);}
  .blk b{display:block;font-weight:400;font-size:11.5px;overflow-wrap:anywhere;}
  .blk span{display:block;font-weight:300;opacity:0.85;font-size:11px;overflow-wrap:anywhere;}
  .nowline{position:absolute;left:0;right:0;height:2px;background:#fff;z-index:5;pointer-events:none;}
  .nowline::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#fff;}
  /* ----- month ----- */
  .mhead{display:flex;padding:6px 6px 4px;}
  .mhead div{flex:1;text-align:center;font-size:12px;font-weight:500;color:var(--ink-soft);}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 6px;}
  .mday{min-height:92px;border-top:1px solid var(--line);padding:3px 2px;overflow:hidden;cursor:pointer;}
  .mday .n{font-weight:300;display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;font-size:13px;}
  .mday.out .n{color:#5f6368;}
  .mday.today .n{background:var(--accent);color:var(--accent-ink);font-weight:400;}
  .mday .chip{margin-bottom:2px;font-size:10px;padding:1px 3px;}
  .mday .moretxt{display:block;}
  /* ----- slide animation when swiping to the next / previous week, day or month ----- */
  @keyframes inNext{from{transform:translateX(34px);opacity:0.2;}to{transform:none;opacity:1;}}
  @keyframes inPrev{from{transform:translateX(-34px);opacity:0.2;}to{transform:none;opacity:1;}}
  .in-next{animation:inNext .22s ease-out;} .in-prev{animation:inPrev .22s ease-out;}
  .fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:18px;border:1px solid #3b6fd1;background:var(--fab);color:#fff;font-size:34px;box-shadow:0 6px 18px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:25;}
  /* ----- menus ----- */
  .scrim{position:fixed;inset:0;z-index:40;}
  .menu{position:fixed;z-index:41;left:10px;top:calc(72px + env(safe-area-inset-top));background:#3c4043;border-radius:14px;padding:6px 0;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,0.6);}
  .menu.t{left:70px;}
  .menu button{font-weight:300;display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--ink);font-size:16px;padding:13px 18px;text-align:left;}
  .menu button:active{background:rgba(255,255,255,0.1);}
  .menu .tick{width:18px;color:var(--accent);font-weight:500;}
  .menu hr{border:none;border-top:1px solid #5f6368;margin:6px 0;}
  .menu .ver{font-size:11px;color:var(--ink-soft);padding:6px 18px 8px;}
  /* editor + sign-in are normal pages, not pop-ups, so nothing ever needs its own scroll bar */
  .page{padding:calc(14px + env(safe-area-inset-top)) 16px 30px;max-width:560px;margin:0 auto;}
  .page h2{margin:6px 0 14px;font-size:22px;font-weight:400;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:5px;}
  input,select,textarea{font-weight:300;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;font-family:inherit;font-size:16px;padding:12px;border:1px solid #5f6368;border-radius:10px;background:var(--card);color:var(--ink);}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='%239aa0a6' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;}
  textarea{resize:none;overflow:hidden;}
  input[type=date],input[type=time]{min-height:48px;}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip2{font-weight:400;border:1px solid #5f6368;background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink);}
  .chip2.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:500;background:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:none;color:var(--ink);border:1px solid #5f6368;}
  .btn.danger{background:#5c2b29;color:var(--danger);}
  .btn:disabled{opacity:0.6;}
  .row{display:flex;gap:10px;margin-top:10px;}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin:6px 0;}
  .sug{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:#3c4043;border:1px solid #5f6368;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.5);overflow:hidden;}
  .sug button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #5f6368;padding:13px 12px;font-size:15px;color:var(--ink);}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#e8eaed;color:#202124;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center;}
  .login{padding-top:calc(60px + env(safe-area-inset-top));}
  .login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 14px;}
  .login h2{text-align:center;}
  .login p{text-align:center;color:var(--ink-soft);font-size:14px;margin:0 0 18px;}
  .evdetail a{color:var(--accent);font-weight:500;text-decoration:none;}
  #view{touch-action:pan-y;}
  .blk.dragging{opacity:0.92;box-shadow:0 8px 22px rgba(0,0,0,0.7);outline:2px solid #fff;z-index:30;}
  .chip.dragging{position:fixed;z-index:60;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,0.7);outline:2px solid #fff;}
  .mday.droptarget{background:rgba(138,180,248,0.25);}
  #dragtip{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));background:#e8eaed;color:#202124;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:400;z-index:70;pointer-events:none;white-space:nowrap;}
  .sw{display:flex;flex-wrap:wrap;gap:10px;}
  .sw button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .sw button.sel{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset;}
  .sw button.auto{width:auto;border-radius:999px;padding:0 14px;font-size:13px;font-weight:400;color:var(--ink);background:var(--card);border:1px solid #5f6368;}
  .sw button.auto.sel{border-color:#fff;}
  .linkbtn{background:none;border:none;color:var(--accent);font-size:14px;padding:8px 0 0;font-weight:400;}
  .manual .field{margin-bottom:10px;}
</style>
</head>

/* ---------- the same calendar the tracker uses: eccData/officeCalendar = {value:[events]} ---------- */
const CAL_DEFAULTS = [
  {key:'estimate', label:'Estimate', color:'#0E6E76'}, {key:'work', label:'Work', color:'#3E8F5C'},
  {key:'holiday', label:'Holiday', color:'#B5791C'}, {key:'meeting', label:'Meeting', color:'#C23B2E'},
  {key:'other', label:'Other', color:'#5B6672'}];
const VAN_COLORS = ['#1E88E5','#43A047','#8E24AA','#D81B60','#00ACC1','#3949AB','#6D4C41','#5E35B1'];
const EVENT_COLORS = ['#D50000','#E67C73','#F4511E','#EF6C00','#F09300','#F6BF26','#C0CA33','#7CB342','#33B679','#0B8043','#00897B','#039BE5','#4FC3F7','#1E88E5','#3F51B5','#7986CB','#8E24AA','#BA68C8','#D81B60','#F06292','#6D4C41','#616161'];
const SWATCH_PALETTE = ['#E53935','#1E88E5','#43A047','#FB8C00','#8E24AA','#00ACC1','#D81B60','#F9A825','#3949AB','#7CB342','#6D4C41','#F4511E','#5E35B1','#00897B','#C0CA33','#546E7A'];

function lsGet(k){ try { return localStorage.getItem('ecccal_'+k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem('ecccal_'+k, v); } catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseIso(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n){ const d = parseIso(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ordinal(n){ const v=n%100; return n+(['th','st','nd','rd'][(v-20)%10]||['th','st','nd','rd'][v]||'th'); }
function longDate(iso){ const d = parseIso(iso); return `${DAYS[d.getDay()]} ${ordinal(d.getDate())} ${MONTHS[d.getMonth()]}`; }

function categories(){ return (settings.calendarCategories && settings.calendarCategories.length) ? settings.calendarCategories : CAL_DEFAULTS; }
function categoryByKey(k){ return categories().find(c=>c.key===k) || {key:k, label:k||'Other', color:'#5B6672'}; }
function officeCrew(){ return crew.filter(c=> !c.archived && c.department==='office'); }
function staffColor(id){
  const c = crew.find(x=>x.id===id); if(!c) return '#9AA3AA';
  if(c.color) return c.color;
  const idx = crew.filter(x=>!x.archived).findIndex(x=>x.id===id);
  return idx>-1 ? VAN_COLORS[idx % VAN_COLORS.length] : '#9AA3AA';
}
function personalColor(c){
  if(c.personalColor) return c.personalColor;
  const i = SWATCH_PALETTE.indexOf(staffColor(c.id));
  return i>-1 ? SWATCH_PALETTE[(i+8) % SWATCH_PALETTE.length] : '#8E24AA';
}
function staffName(c){ return [c.forename, c.surname].filter(Boolean).join(' ') || c.name || ''; }
function eventColor(e){
  if(e.color) return e.color;
  const s = e.staffId ? crew.find(c=>c.id===e.staffId) : null;
  if(s) return e.personal ? personalColor(s) : staffColor(s.id);
  return categoryByKey(e.type).color;
}
// Who "I" am: the office person whose email matches the sign-in, otherwise the Main Admin.
function me(){
  const people = officeCrew();
  const email = user && user.email ? user.email.toLowerCase() : '';
  return people.find(c=> c.email && c.email.toLowerCase()===email) || people.find(c=>c.isMainAdmin) || people[0] || null;
}
function eventCoversDay(e, iso){ return e.date <= iso && (e.endDate || e.date) >= iso; }
function visibleEvents(){
  const m = me();
  return events.filter(e=> scope==='all' || !m || !e.staffId || e.staffId===m.id);
}
function eventsOn(iso){
  return visibleEvents().filter(e=>eventCoversDay(e, iso)).sort((a,b)=>{
    const at = a.startTime||'', bt = b.startTime||'';
    if(!at !== !bt) return at ? 1 : -1;     // all-day first
    return at.localeCompare(bt) || (a.title||'').localeCompare(b.title||'');
  });
}

/* ---------- saving: change just this event, against the live server copy, never a stale whole list ---------- */
async function writeEvent(op, entry, id){
  const ref = db.collection('eccData').doc('officeCalendar');
  await db.runTransaction(async tx=>{
    const snap = await tx.get(ref);
    let list = (snap.exists && Array.isArray(snap.data().value)) ? snap.data().value.slice() : [];
    if(op==='delete') list = list.filter(e=>e.id!==id);
    else if(list.some(e=>e.id===entry.id)) list = list.map(e=> e.id===entry.id ? entry : e);
    else list.push(entry);
    tx.set(ref, {value: JSON.parse(JSON.stringify(list))});
  });
}

/* ---------- screens ---------- */
function toast(msg){
  const old = document.getElementById('toast'); if(old) old.remove();
  const t = document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 2800);
}

/* ---------- the calendar screens: week (default), day and month ---------- */
function mondayOf(iso){ const d = parseIso(iso); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return isoOf(d); }
function newEventDate(){
  const today = isoOf(new Date());
  return (mode==='week' && mondayOf(cur)===mondayOf(today)) ? today : cur;
}
function textOn(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#fff';
  const n = parseInt(m[1],16), c = [(n>>16)&255,(n>>8)&255,n&255].map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2]) > 0.4 ? '#202124' : '#ffffff';
}
const hhmm = t=>{ const [h,m] = String(t).split(':').map(Number); return h*60 + (m||0); };
// Timed events sit on the day they start; anything with no time (or the later days of a multi-day one) goes in the strip under the dates.
function timedOn(iso){ return visibleEvents().filter(e=> e.startTime && e.date===iso); }
function allDayOn(iso){
  return visibleEvents().filter(e=> (!e.startTime && eventCoversDay(e, iso)) || (e.startTime && e.endDate && e.endDate>e.date && iso>e.date && iso<=e.endDate));
}
function layoutDay(list){
  const items = list.map(e=>{
    const start = hhmm(e.startTime);
    let end = (e.endDate && e.endDate>e.date) ? 24*60 : (e.endTime ? hhmm(e.endTime) : start+60);
    if(end <= start) end = start + 60;
    return {e, start, end: Math.min(end, 24*60), col:0, cols:1};
  }).sort((a,b)=> a.start-b.start || b.end-a.end);
  let cluster = [], clusterEnd = 0;
  const flush = ()=>{ const n = cluster.reduce((m,x)=>Math.max(m,x.col+1),1); cluster.forEach(x=>x.cols=n); cluster = []; };
  items.forEach(it=>{
    if(cluster.length && it.start >= clusterEnd) flush();
    const used = cluster.filter(x=>x.end>it.start).map(x=>x.col);
    let c = 0; while(used.includes(c)) c++;
    it.col = c; cluster.push(it); clusterEnd = Math.max(clusterEnd, it.end);
  });
  flush();
  return items;
}
function blockHtml(it){
  const e = it.e, col = eventColor(e), fg = textOn(col);
  const h = Math.max((it.end-it.start)/60*HOUR - 1, 22), w = 100/it.cols;
  const tall = h >= 46;
  return `<div class="blk" data-ev="${esc(e.id)}" data-start="${it.start}" data-dur="${it.end-it.start}" style="top:calc(var(--hour)*${(it.start/60).toFixed(4)});height:max(calc(var(--hour)*${((it.end-it.start)/60).toFixed(4)} - 1px),22px);left:${it.col*w}%;width:${w}%;background:${col};color:${fg};">
    <b>${esc(e.title)}</b>${tall && e.location ? `<span>${esc(e.location)}</span>` : ''}${h>=70 && e.startTime ? `<span>${esc(e.startTime)}${e.endTime?' – '+esc(e.endTime):''}</span>` : ''}</div>`;
}
function chipHtml(e){ const col = eventColor(e); return `<div class="chip" data-ev="${esc(e.id)}" style="background:${col};color:${textOn(col)}">${esc(e.title)}</div>`; }
function titleText(){
  const d = parseIso(cur), now = new Date();
  const yr = d.getFullYear()!==now.getFullYear() ? ` <small>${d.getFullYear()}</small>` : '';
  if(mode==='week'){ const a = parseIso(mondayOf(cur)); return MONTHS[a.getMonth()] + (a.getFullYear()!==now.getFullYear() ? ` <small>${a.getFullYear()}</small>` : ''); }
  return MONTHS[d.getMonth()] + yr;
}
function initials(){ const m = me(); const n = m ? staffName(m) : (user && user.email) || '?'; return n.split(/[\s@.]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('') || '?'; }

function renderCalendar(app){
  keepY = window.scrollY;
  const todayIso = isoOf(new Date());
  const days = mode==='week' ? [0,1,2,3,4,5,6].map(i=>addDays(mondayOf(cur), i)) : mode==='day' ? [cur] : [];
  const waiting = !(loaded.events && loaded.crew);
  let headerBottom = '', body = '';
  if(mode==='month'){
    const d = parseIso(cur), y = d.getFullYear(), mo = d.getMonth();
    const startOffset = (new Date(y,mo,1).getDay()+6)%7, gridStart = new Date(y,mo,1-startOffset);
    headerBottom = `<div class="mhead">${['M','T','W','T','F','S','S'].map(x=>`<div>${x}</div>`).join('')}</div>`;
    let cells = '';
    for(let i=0;i<42;i++){
      const dd = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i), iso = isoOf(dd);
      if(i>=35 && dd.getMonth()!==mo) break;
      const evs = visibleEvents().filter(e=>eventCoversDay(e, iso)).sort((a,b)=> (a.startTime?1:0)-(b.startTime?1:0) || (a.startTime||'').localeCompare(b.startTime||''));
      const shown = evs.slice(0,3), extra = evs.length-shown.length;
      cells += `<div class="mday ${dd.getMonth()!==mo?'out':''} ${iso===todayIso?'today':''}" data-day="${iso}"><div class="n">${dd.getDate()}</div>${shown.map(chipHtml).join('')}${extra>0?`<span class="moretxt">+${extra} more</span>`:''}</div>`;
    }
    body = `<div class="mgrid" id="body">${cells}</div>`;
  } else {
    const single = days.length===1;
    const adMax = Math.max(0, ...days.map(i=> allDayOn(i).length));
    headerBottom = `<div class="dow ${single?'single':''}"><div class="gut"></div>${days.map(iso=>{ const d = parseIso(iso); return `<button class="c ${iso===todayIso?'today':''}" data-day="${iso}" aria-label="${esc(longDate(iso))}">${single ? DAYS[d.getDay()].slice(0,3).toUpperCase() : ['S','M','T','W','T','F','S'][d.getDay()]}<b>${d.getDate()}</b></button>`; }).join('')}</div>`
      + (`<div class="allday"><div class="gut"></div>${days.map(iso=>{ const l = allDayOn(iso), shown = l.slice(0,single?6:2), extra = l.length-shown.length; return `<div class="c">${shown.map(chipHtml).join('')}${extra>0?`<span class="moretxt">+${extra}</span>`:''}</div>`; }).join('')}</div>`);
    const labels = Array.from({length:23},(_,i)=>`<span style="top:calc(var(--hour)*${i+1})">${pad(i+1)}:00</span>`).join('');
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    body = `<div class="tg" id="body"><div class="labels">${labels}</div><div class="cols">${days.map(iso=>`<div class="col" data-col="${iso}">${layoutDay(timedOn(iso)).map(blockHtml).join('')}${iso===todayIso?`<div class="nowline" id="nowline" style="top:calc(var(--hour)*${(nowMin/60).toFixed(4)})"></div>`:''}</div>`).join('')}</div></div>`;
  }
  app.innerHTML = `
    <div class="top">
      <div class="bar1">
        <div class="pill"><button id="menuBtn" aria-label="Menu">☰</button></div>
        <button class="title" id="titleBtn">${titleText()} <span style="font-size:16px">▾</span></button>
        <div class="pill"><button id="todayBtn" aria-label="Go to today"><span class="todaybox">${new Date().getDate()}</span></button></div>
        <button class="avatar" id="avatarBtn" aria-label="Account">${esc(initials())}</button>
      </div>
      <div class="sync">${waiting ? 'Loading…' : (fromCache ? 'Offline — showing saved copy' : '')}</div>
      ${headerBottom}
    </div>
    <div id="view" class="${slide==='next'?'in-next':slide==='prev'?'in-prev':''}">${body}</div>
    <button class="fab" id="fab" aria-label="Add event">+</button>
    ${menuOpen ? menuHtml() : ''}`;
  slide = '';
  wireCalendar(app);
}
function menuHtml(){
  if(menuOpen==='view') return `<div class="scrim" id="scrim"></div><div class="menu t">
    ${['day','week','month'].map(m=>`<button data-mode="${m}"><span class="tick">${mode===m?'✓':''}</span>${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>`;
  return `<div class="scrim" id="scrim"></div><div class="menu">
    <button data-scope="mine"><span class="tick">${scope==='mine'?'✓':''}</span>Mine</button>
    <button data-scope="all"><span class="tick">${scope==='all'?'✓':''}</span>Everyone</button><hr>
    <button data-mode="day"><span class="tick">${mode==='day'?'✓':''}</span>Day</button>
    <button data-mode="week"><span class="tick">${mode==='week'?'✓':''}</span>Week</button>
    <button data-mode="month"><span class="tick">${mode==='month'?'✓':''}</span>Month</button><hr>
    <button id="signout"><span class="tick"></span>Sign out</button>
    <div class="ver">${esc(user && user.email || '')}<br>${BUILD_VERSION}</div></div>`;
}
function go(n){          // next / previous day, week or month
  const d = parseIso(cur);
  if(mode==='month'){ const last = new Date(d.getFullYear(), d.getMonth()+n+1, 0).getDate(); cur = isoOf(new Date(d.getFullYear(), d.getMonth()+n, Math.min(d.getDate(), last))); }
  else cur = addDays(cur, n * (mode==='week' ? 7 : 1));
  slide = n>0 ? 'next' : 'prev'; render();
}
function headerH(){ const t = document.querySelector('.top'); return t ? t.offsetHeight : 180; }
function scrollToHour(h){ const b = document.getElementById('body'); if(!b || mode==='month') return; const top = b.getBoundingClientRect().top + window.scrollY; window.scrollTo(0, Math.max(0, top + h*HOUR - headerH())); }
let lastScrollKey = '', keepY = 0;
function wireCalendar(app){
  const q = sel=> app.querySelectorAll(sel);
  const closeMenu = ()=>{ menuOpen=''; render(); };
  document.getElementById('menuBtn').onclick = ()=>{ menuOpen='main'; render(); };
  document.getElementById('avatarBtn').onclick = ()=>{ menuOpen='main'; render(); };
  document.getElementById('titleBtn').onclick = ()=>{ menuOpen='view'; render(); };
  document.getElementById('todayBtn').onclick = ()=>{ cur = isoOf(new Date()); lastScrollKey=''; render(); };
  const scrim = document.getElementById('scrim'); if(scrim) scrim.onclick = closeMenu;
  q('[data-mode]').forEach(b=> b.onclick = ()=>{ mode = b.dataset.mode; lsSet('mode', mode); menuOpen=''; lastScrollKey=''; render(); });
  q('[data-scope]').forEach(b=> b.onclick = ()=>{ scope = b.dataset.scope; lsSet('scope', scope); menuOpen=''; render(); });
  const so = document.getElementById('signout'); if(so) so.onclick = ()=>{ menuOpen=''; started = false; auth.signOut(); };
  document.getElementById('fab').onclick = ()=> openEditor(null);
  // taps: an event opens it; a date number (week/day) or a month cell jumps to that day
  q('[data-ev]').forEach(b=> b.onclick = ev=>{ ev.stopPropagation(); if(Date.now()<suppressClickUntil) return; const e = events.find(x=>x.id===b.dataset.ev); if(e) openEditor(e); });
  q('.dow [data-day]').forEach(b=> b.onclick = ()=>{ cur = b.dataset.day; mode='day'; lsSet('mode',mode); lastScrollKey=''; render(); });
  q('.mday').forEach(b=> b.onclick = ()=>{ if(Date.now()<suppressClickUntil) return; cur = b.dataset.day; mode='day'; lsSet('mode',mode); lastScrollKey=''; render(); });
  wireSwipe(document.getElementById('view'));
  // a new view (first open, Day/Week switch, Today) starts at 06:00 with 06:00-20:00 filling the screen; swiping weeks and data refreshes keep your place
  const key = mode;
  if(mode!=='month' && lastScrollKey!==key){
    lastScrollKey = key;
    if(!userZoomed){ HOUR = Math.max(30, (window.innerHeight - headerH())/14.05); document.documentElement.style.setProperty('--hour', HOUR+'px'); }
    scrollToHour(5.95);
  } else { window.scrollTo(0, keepY); }
  wireDrag(document.getElementById('view'));
}
let savedScroll = 0;
window.addEventListener('scroll', ()=>{ savedScroll = window.scrollY; }, {passive:true});
let pinchRaf = 0, pinchNext = null;
function setHour(h, cy){
  h = Math.max(24, Math.min(150, h)); pinchNext = {h, cy};
  if(pinchRaf) return;
  pinchRaf = requestAnimationFrame(()=>{
    pinchRaf = 0; const p = pinchNext; if(!p) return;
    const b = document.getElementById('body'); if(!b) return;
    const docTop = b.getBoundingClientRect().top + window.scrollY, hourAt = (p.cy - (b.getBoundingClientRect().top)) / HOUR;
    HOUR = p.h; document.documentElement.style.setProperty('--hour', HOUR+'px');
    window.scrollTo(0, docTop + hourAt*HOUR - p.cy);
  });
}
let pinch = null;
const tdist = t=> Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
document.addEventListener('touchstart', e=>{
  if(drag || lp) return;
  if(e.touches.length===2 && screen==='cal' && mode!=='month' && e.target.closest && e.target.closest('#view')){ pinch = {d: tdist(e.touches), h: HOUR}; clearLp(); }
  else if(e.touches.length>2) pinch = null;
}, {passive:true});
document.addEventListener('touchmove', e=>{
  if(!pinch || e.touches.length!==2) return;
  setHour(pinch.h * tdist(e.touches)/pinch.d, (e.touches[0].clientY+e.touches[1].clientY)/2);
}, {passive:true});
document.addEventListener('touchend', e=>{ if(pinch && e.touches.length<2){ pinch = null; userZoomed = true; lsSet('hour2', String(Math.round(HOUR))); cancelAnimationFrame(pinchRaf); pinchRaf = 0; if(pinchNext){ HOUR = pinchNext.h; document.documentElement.style.setProperty('--hour', HOUR+'px'); pinchNext = null; } render(); } }, {passive:true});

/* ---------- hold an event, then drag it to a new time / day ---------- */
let drag = null, lp = null, suppressClickUntil = 0;
function clearLp(){ if(lp){ clearTimeout(lp.timer); lp = null; } }
function wireDrag(view){
  if(!view) return;
  view.addEventListener('touchstart', e=>{
    if(e.touches.length!==1 || pinch) { clearLp(); return; }
    const el = e.target.closest && e.target.closest('.blk, .mday .chip'); if(!el){ clearLp(); return; }
    const t = e.touches[0]; clearLp();
    lp = {el, x:t.clientX, y:t.clientY, timer:setTimeout(()=>beginDrag(), 450)};
  }, {passive:true});
  view.addEventListener('contextmenu', e=>{ if(e.target.closest && e.target.closest('.blk, .chip')) e.preventDefault(); });
}
function beginDrag(){
  if(!lp) return; const el = lp.el, ev = events.find(x=>x.id===el.dataset.ev); if(!ev){ lp = null; return; }
  const r = el.getBoundingClientRect(), isGrid = el.classList.contains('blk');
  drag = {el, ev, isGrid, grab: lp.y - r.top, grabX: lp.x - r.left, x: lp.x, y: lp.y, newDate: ev.date, newStart: ev.startTime, raf: 0, pending:false};
  if(isGrid){ drag.dur = +el.dataset.dur; drag.startMin = +el.dataset.start; }
  lp = null; el.classList.add('dragging'); if(navigator.vibrate) try{ navigator.vibrate(35); }catch(_){}
  const tip = document.createElement('div'); tip.id = 'dragtip'; document.body.appendChild(tip);
  updateDrag(); drag.raf = requestAnimationFrame(autoScroll);
}
function updateDrag(){
  const d = drag; if(!d) return;
  if(d.isGrid){
    const cols = [...document.querySelectorAll('#view .col')]; if(!cols.length) return;
    let col = cols.find(c=>{ const r = c.getBoundingClientRect(); return d.x>=r.left && d.x<r.right; });
    if(!col) col = d.x < cols[0].getBoundingClientRect().left ? cols[0] : cols[cols.length-1];
    const top = d.y - d.grab - col.getBoundingClientRect().top;
    let min = Math.round(top/HOUR*60/15)*15; min = Math.max(0, Math.min(min, 24*60 - Math.min(d.dur, 24*60-15)));
    if(d.el.parentNode!==col) col.appendChild(d.el);
    d.el.style.top = `calc(var(--hour)*${(min/60).toFixed(4)})`; d.el.style.left = '0'; d.el.style.width = '100%';
    d.newDate = col.dataset.col; d.newMin = min; d.newStart = pad(Math.floor(min/60))+':'+pad(min%60);
    const endMin = min + d.dur;
    document.getElementById('dragtip').textContent = longDate(d.newDate)+' · '+d.newStart+(d.ev.endTime ? ' – '+pad(Math.floor(Math.min(endMin,1439)/60))+':'+pad(Math.min(endMin,1439)%60) : '');
  } else {
    d.el.style.left = (d.x - d.grabX)+'px'; d.el.style.top = (d.y - 10)+'px'; d.el.style.width = '90px';
    d.el.style.pointerEvents = 'none';
    const cell = document.elementFromPoint(d.x, d.y), day = cell && cell.closest ? cell.closest('.mday') : null;
    document.querySelectorAll('.mday.droptarget').forEach(c=>c.classList.remove('droptarget'));
    if(day){ day.classList.add('droptarget'); d.newDate = day.dataset.day; }
    document.getElementById('dragtip').textContent = longDate(d.newDate);
  }
}
function autoScroll(){
  const d = drag; if(!d) return;
  const top = headerH() + 30, bottom = window.innerHeight - 90;
  if(d.y > bottom) { window.scrollBy(0, Math.min(18, (d.y-bottom)/3+4)); updateDrag(); }
  else if(d.y < top && window.scrollY>0) { window.scrollBy(0, -Math.min(18, (top-d.y)/3+4)); updateDrag(); }
  d.raf = requestAnimationFrame(autoScroll);
}
document.addEventListener('touchmove', e=>{
  const t = e.touches[0];
  if(lp && !drag){ if(Math.hypot(t.clientX-lp.x, t.clientY-lp.y) > 10) clearLp(); return; }
  if(drag){ if(e.cancelable) e.preventDefault(); drag.x = t.clientX; drag.y = t.clientY; updateDrag(); }
}, {passive:false});
async function endDrag(cancel){
  clearLp();
  const d = drag; if(!d) return; drag = null; cancelAnimationFrame(d.raf);
  const tip = document.getElementById('dragtip'); if(tip) tip.remove();
  suppressClickUntil = Date.now() + 500;
  const ev = d.ev, moved = d.newDate!==ev.date || (d.isGrid && d.newStart!==ev.startTime);
  if(cancel || !moved){ render(); return; }
  const delta = Math.round((parseIso(d.newDate) - parseIso(ev.date))/86400000);
  const entry = {...ev, date: d.newDate};
  if(ev.endDate) entry.endDate = addDays(ev.endDate, delta);
  if(d.isGrid){ entry.startTime = d.newStart; if(ev.endTime){ const e2 = Math.min(d.newMin + d.dur, 24*60-1); entry.endTime = pad(Math.floor(e2/60))+':'+pad(e2%60); } }
  events = events.map(x=> x.id===ev.id ? entry : x); render();
  try { await writeEvent('save', entry); toast('Moved to '+longDate(entry.date)+(entry.startTime?', '+entry.startTime:'')); }
  catch(err){ events = events.map(x=> x.id===ev.id ? ev : x); render(); toast(saveError(err)); }
}
document.addEventListener('touchend', e=>{ if(drag){ if(e.cancelable) e.preventDefault(); endDrag(false); } else clearLp(); }, {passive:false});
document.addEventListener('touchcancel', ()=>{ if(drag) endDrag(true); else clearLp(); });
function wireSwipe(el){
  if(!el) return;
  let x0=null, y0=null;
  el.addEventListener('touchstart', e=>{ if(e.touches.length>1){ x0=null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null || pinch || drag) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5) go(dx<0 ? 1 : -1);
  }, {passive:true});
}
setInterval(()=>{ const l = document.getElementById('nowline'); if(l){ const n = new Date(); l.style.top = 'calc(var(--hour)*'+((n.getHours()*60+n.getMinutes())/60).toFixed(4)+')'; } }, 60000);

/* ---------- address suggestions as you type (same Ideal Postcodes account as the tracker's postcode lookup) ---------- */
const IDEAL_POSTCODES_KEY = 'ak_mowobf7dE7Lufy9K0U8bVsm2JXSON';
function suggestAddress(input, box){
  if(!input || !box) return;
  let timer = null, lastQ = '', seq = 0;
  const hide = ()=>{ box.innerHTML = ''; box.style.display = 'none'; };
  async function search(q){
    const mine = ++seq;
    try {
      const res = await fetch('https://api.ideal-postcodes.co.uk/v1/autocomplete/addresses?api_key=' + IDEAL_POSTCODES_KEY + '&query=' + encodeURIComponent(q));
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(mine !== seq) return;
      const r = data && data.result;
      const hits = (r && (r.hits || (Array.isArray(r) ? r : []))) || [];
      const picks = hits.map(h=> h.suggestion || h.address || '').filter(Boolean).slice(0,6);
      if(!picks.length){ hide(); return; }
      box.innerHTML = picks.map((t,i)=>`<button type="button" data-pick="${i}">📍 ${esc(t)}</button>`).join('');
      box.style.display = 'block';
      box.querySelectorAll('[data-pick]').forEach(b=>{
        const choose = ev=>{ ev.preventDefault(); input.value = picks[Number(b.dataset.pick)]; lastQ = input.value; hide(); };
        b.addEventListener('mousedown', choose); b.addEventListener('touchstart', choose, {passive:false});
      });
    } catch(err){ console.warn('Address suggestions unavailable', err); hide(); }
  }
  input.addEventListener('input', ()=>{
    const q = input.value.trim(); clearTimeout(timer);
    if(q.length < 3){ hide(); return; }
    if(q===lastQ) return;
    timer = setTimeout(()=>{ lastQ = q; search(q); }, 300);
  });
  input.addEventListener('blur', ()=> setTimeout(hide, 250));
}
function openEditor(ev, preset){
  editingIsNew = !ev;
  const m = me();
  editing = ev ? {...ev} : {id:uid(), date:(preset && preset.date) || newEventDate(), startTime:(preset && preset.startTime)||'', endTime:(preset && preset.endTime)||'', endDate:'', type:'', personal:false, title:'', staffId: m ? m.id : '', notes:''};
  if(!ev) editing._kind = lsGet('kind') || '';
  else editing._kind = ev.personal ? 'personal' : 'work';
  screen = 'edit'; render(); window.scrollTo(0,0);
}
function renderEditor(app){
  const e = editing, people = officeCrew().slice();
  if(e.staffId && !people.some(c=>c.id===e.staffId)){ const p = crew.find(c=>c.id===e.staffId); if(p) people.push(p); }
  const types = categories().slice();
  if(e.type && !types.some(t=>t.key===e.type)) types.push(categoryByKey(e.type));
  app.innerHTML = `<div class="page">
    <h2>${editingIsNew ? 'Add event' : 'Edit event'}</h2>
    <div class="field"><label>Work or personal?</label><div class="chips">
      <button type="button" class="chip2 ${e._kind==='work'?'sel':''}" data-kind="work">Work</button>
      <button type="button" class="chip2 ${e._kind==='personal'?'sel':''}" data-kind="personal">Personal</button></div></div>
    <div class="field" id="typeField" style="${e._kind==='work'?'':'display:none'}"><label>Type</label><div class="chips">
      ${types.map(t=>`<button type="button" class="chip2 ${e.type===t.key?'sel':''}" data-type="${esc(t.key)}">${esc(t.label)}</button>`).join('')}</div></div>
    <div class="field"><label>Title</label><input id="f_title" value="${esc(e.title)}" placeholder="e.g. Estimate at Miller Homes, or Dentist"></div>
    <div class="two">
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${esc(e.date)}"></div>
      <div class="field"><label>End date (optional)</label><input type="date" id="f_end" value="${esc(e.endDate||'')}"></div></div>
    <div class="two">
      <div class="field"><label>Start time (optional)</label><input type="time" step="300" id="f_start" value="${esc(e.startTime||'')}"></div>
      <div class="field"><label>End time (optional)</label><input type="time" step="300" id="f_stop" value="${esc(e.endTime||'')}"></div></div>
    <div class="field"><label>Who's this for</label><select id="f_staff">
      ${people.some(c=>c.id===e.staffId) ? '' : '<option value="">— choose —</option>'}
      ${people.map(c=>`<option value="${esc(c.id)}" ${e.staffId===c.id?'selected':''}>${esc(staffName(c))}</option>`).join('')}</select></div>
    <div class="field"><label>Colour</label><div class="sw">
      <button type="button" class="auto ${e.color?'':'sel'}" data-color="">Automatic</button>
      ${EVENT_COLORS.map(c=>`<button type="button" class="${e.color===c?'sel':''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="field" style="position:relative;"><label>Location (optional)</label>
      <div id="locOne" style="${e._manual?'display:none':''}"><input id="f_loc" value="${esc(e.location||'')}" autocomplete="off" placeholder="e.g. 12 Oak Road, Sandbach">
      <div id="f_locsug" class="sug"></div>
      <button type="button" class="linkbtn" id="toManual">Or enter the address in separate boxes</button></div>
      <div id="locMan" class="manual" style="${e._manual?'':'display:none'}">
        <div class="field"><label>House name / number and street</label><input id="m_1" autocomplete="off" value="${esc(e._m1||'')}"></div>
        <div class="field"><label>Town / area</label><input id="m_2" autocomplete="off" value="${esc(e._m2||'')}"></div>
        <div class="field"><label>Postcode</label><input id="m_3" autocomplete="off" value="${esc(e._m3||'')}" style="text-transform:uppercase"></div>
        <button type="button" class="linkbtn" id="toOne" style="padding-top:0">Back to one box with suggestions</button></div>
      ${e.location ? `<div class="evdetail" style="margin-top:8px"><a data-maps href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location)}" target="_blank" rel="noopener">Open in Maps ↗</a></div>` : ''}</div>
    <div class="field"><label>Notes (optional)</label><textarea id="f_notes" rows="2">${esc(e.notes||'')}</textarea></div>
    <div class="err" id="ferr"></div>
    <button class="btn" id="save">${editingIsNew ? 'Add event' : 'Save changes'}</button>
    <div class="row"><button class="btn ghost" id="cancel">Cancel</button>${editingIsNew ? '' : '<button class="btn danger" id="del">Delete</button>'}</div>
  </div>`;
  suggestAddress(document.getElementById('f_loc'), document.getElementById('f_locsug'));
  const joinMan = ()=>{ const v = ['m_1','m_2','m_3'].map(i=>document.getElementById(i).value.trim()).filter(Boolean); document.getElementById('f_loc').value = v.join(', '); };
  ['m_1','m_2','m_3'].forEach(i=> document.getElementById(i).oninput = joinMan);
  document.getElementById('toManual').onclick = ()=>{
    keepFields(); const parts = (e.location||'').split(',').map(x=>x.trim()).filter(Boolean);
    const pcRe = /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i;
    e._m3 = parts.length && pcRe.test(parts[parts.length-1]) ? parts.pop() : '';
    e._m1 = parts.shift() || ''; e._m2 = parts.join(', '); e._manual = true; renderEditor(app);
  };
  document.getElementById('toOne').onclick = ()=>{ keepFields(); e._manual = false; renderEditor(app); };
  app.querySelectorAll('[data-color]').forEach(b=> b.onclick = ()=>{ keepFields(); e.color = b.dataset.color; renderEditor(app); });
  const grow = ta=>{ ta.style.height='auto'; ta.style.height = ta.scrollHeight+'px'; };
  const notes = document.getElementById('f_notes'); grow(notes); notes.oninput = ()=> grow(notes);
  app.querySelectorAll('[data-kind]').forEach(b=> b.onclick = ()=>{ keepFields(); e._kind = b.dataset.kind; renderEditor(app); });
  app.querySelectorAll('[data-type]').forEach(b=> b.onclick = ()=>{ keepFields(); e.type = b.dataset.type; renderEditor(app); });
  function keepFields(){
    e.title = document.getElementById('f_title').value; e.date = document.getElementById('f_date').value; e.endDate = document.getElementById('f_end').value;
    e.startTime = document.getElementById('f_start').value; e.endTime = document.getElementById('f_stop').value;
    e.staffId = document.getElementById('f_staff').value; e.notes = document.getElementById('f_notes').value; e.location = document.getElementById('f_loc').value;
    if(e._manual){ e._m1 = document.getElementById('m_1').value; e._m2 = document.getElementById('m_2').value; e._m3 = document.getElementById('m_3').value; }
  }
  document.getElementById('cancel').onclick = ()=>{ screen='cal'; render(); };
  const del = document.getElementById('del');
  if(del) del.onclick = async ()=>{
    if(!confirm('Remove this calendar event?')) return;
    del.disabled = true;
    try { await writeEvent('delete', null, e.id); screen='cal'; render(); toast('Event removed'); }
    catch(err){ del.disabled = false; document.getElementById('ferr').textContent = saveError(err); }
  };
  document.getElementById('save').onclick = async ()=>{
    keepFields();
    const er = document.getElementById('ferr'); er.textContent = '';
    if(!e.title.trim()) return er.textContent = 'Please add a title.';
    if(!e.date) return er.textContent = 'Please pick a date.';
    if(!e._kind) return er.textContent = 'Please choose Work or Personal.';
    if(e._kind==='work' && !e.type) return er.textContent = 'Please choose the type of work.';
    if(!e.staffId) return er.textContent = "Please choose who this is for.";
    if(e.endTime && !e.startTime) return er.textContent = 'Please add a start time as well as the end time.';
    if(e.endDate && e.endDate < e.date) return er.textContent = 'The end date can\'t be before the start date.';
    if(e.startTime && e.endTime && (!e.endDate || e.endDate===e.date) && e.endTime <= e.startTime) return er.textContent = 'The end time needs to be after the start time.';
    const entry = {id:e.id, type: e._kind==='work' ? e.type : '', title:e.title.trim(), date:e.date, endDate:e.endDate||'', startTime:e.startTime||'', endTime:e.endTime||'', staffId:e.staffId, personal:e._kind==='personal', location:(e.location||'').trim(), notes:e.notes||''};
    if(e.color) entry.color = e.color;
    const b = document.getElementById('save'); b.disabled = true; b.textContent = 'Saving…';
    try {
      await writeEvent('save', entry);
      lsSet('kind', e._kind);
      cur = entry.date;
      screen='cal'; render(); toast(editingIsNew ? 'Event added' : 'Saved');
    } catch(err){ b.disabled = false; b.textContent = editingIsNew ? 'Add event' : 'Save changes'; er.textContent = saveError(err); }
  };
}
function saveError(err){
  if(err && err.code==='permission-denied') return "Couldn't save — the database didn't allow it. Try signing in again.";
  if(err && (err.code==='unavailable' || /fetch|network/i.test(err.message||''))) return "Couldn't save — no connection. Check your internet and try again.";
  return "Couldn't save (" + ((err && (err.code||err.message)) || 'unknown') + ').';
}

/* ---------- data + sign-in ---------- */
function listen(key, apply){
  db.collection('eccData').doc(key).onSnapshot({includeMetadataChanges:true}, snap=>{
    if(snap.exists && snap.data().value!==undefined){ apply(snap.data().value); if(key==='officeCalendar') fromCache = snap.metadata.fromCache; }
    else if(!snap.metadata.fromCache) apply(key==='settings' ? {} : []);
    if(screen!=='edit') render();
  }, err=>{ console.error('listener', key, err); fromCache = true; if(screen!=='edit') render(); });
}
let started = false;
auth.onAuthStateChanged(u=>{
  user = u; authChecked = true;
  if(u && !u.isAnonymous && !started){
    started = true;
    listen('officeCalendar', v=>{ events = Array.isArray(v) ? v.filter(e=>e && e.id!=null && e.date) : []; loaded.events = true; });
    listen('crew', v=>{ crew = Array.isArray(v) ? v : []; loaded.crew = true; });
    listen('settings', v=>{ settings = v && typeof v==='object' ? v : {}; });
  }
  render();
});
render();
